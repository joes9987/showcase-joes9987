name: Sync Forth

on:
  schedule:
    # Every 12 hours — keeps live reachability from going silently stale
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Forth and refresh status JSON
        run: npm run sync:forth
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forth-status.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh Forth live probe"
            git push
          fi
